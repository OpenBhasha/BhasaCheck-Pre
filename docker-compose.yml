services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    env_file: ./ml-service/.env
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/rsml
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      INTERNAL_CALLBACK_URL: http://backend:5000
      # NOT overridden to http://backend:5000 like the others above: this
      # one is used to build URLs for the *browser* (and, via docker-compose,
      # the ml-service container downloading a locally-stored original) — it
      # needs to stay whatever host:port the frontend itself already reaches
      # this service at. Local storage under docker-compose only works if
      # that's a hostname every consumer (host browser, ml-service container)
      # can resolve; if not, use Cloudinary storage when running via compose.
    ports:
      - "5000:5000"
    volumes:
      - audio_storage:/srv/storage
    depends_on:
      - mongo
      - redis
      - ml-service

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["node", "dist/workers/audioProcessing.worker.js"]
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/rsml
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      INTERNAL_CALLBACK_URL: http://backend:5000
    volumes:
      - audio_storage:/srv/storage
    depends_on:
      - mongo
      - redis
      - ml-service
      - backend

volumes:
  mongo_data:
  redis_data:
  audio_storage:
